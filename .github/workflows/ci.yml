name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_tests:
        description: Run disposable WordPress browser regression suites
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.7
      - run: pnpm run setup
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test:security
      - run: pnpm test:gestion
      - run: pnpm test:cache
      - run: pnpm audit:all
      - run: pnpm package
      - run: pnpm test:install
      - uses: actions/upload-artifact@v4
        with:
          name: rp-usados-rc-${{ matrix.os }}
          path: |
            dist/rp-usados.zip
            dist/rp-usados-security.zip
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.browser_tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@10.34.7
      - run: pnpm run setup
      - run: pnpm --dir tools exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:security-http
      - run: pnpm test:http
      - run: pnpm test:public
