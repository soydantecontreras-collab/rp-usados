<text x="535" y="582" fill="#aebdc5" font-family="system-ui,sans-serif" font-size="14">Trayectoria esquemática. Coordenadas exactas</text><text x="535" y="603" fill="#aebdc5" font-family="system-ui,sans-serif" font-size="14">del ensayo disponibles en camera-path.json.</text>
