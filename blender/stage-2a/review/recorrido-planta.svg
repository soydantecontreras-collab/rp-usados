<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Esquema de planta del blockout y cámaras</title><desc id="desc">Edificio en esquina con frente del portón a la izquierda, Chacabuco abajo, ochava diagonal y recorrido de A hasta 75 centímetros dentro del acceso. Escala y geometría aproximadas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10" fill="#e8bd7d"/></marker></defs>
<rect width="900" height="650" fill="#1c252c"/>
<g fill="#dce6ea" font-family="system-ui,sans-serif"><text x="35" y="40" font-size="23">Relación espacial · hipótesis de blockout</text><text x="35" y="67" fill="#aebdc5" font-size="15">Planta de orientación. No es un plano medido del inmueble.</text></g>
